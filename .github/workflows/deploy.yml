name: Deploy Compose Multiplatform Wasm to GitHub Pages

on:
  push:
    branches:
      - master # Change to master if your default branch uses that name

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Web Production Distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Point strictly to the production output path
          path: composeApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5